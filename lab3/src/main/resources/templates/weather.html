<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Forecast</title>
    <style>
        /* NEW: This container puts the card and the image side-by-side */
        .flex-row {
            display: flex;
            align-items: flex-start; /* Keeps both at the same top level */
            gap: 20px; /* Space between the card and the image */
        }

        .weather-card {
            border: 1px solid #ccc;
            padding: 20px;
            width: 350px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }
        .temp-main { font-size: 2em; font-weight: bold; }
        .label { color: #666; font-weight: bold; }

        /* Optional: Set a size for the ad image */
        .ad-image {
            max-width: 600px;
            height: auto;
        }
    </style>
</head>
<body>

<!-- Wrap the existing div and the image in this container -->
<div class="flex-row">

    <div class="weather-card">
        <h3>Vremea în <span th:text="${location}">Location</span></h3>
        <p><span class="label">Data:</span> <span th:text="${forecast.date}">01-01-2024</span></p>

        <p><span class="label">Coordonate:</span> <span th:text="|${forecast.location}%|">0%</span></p>

        <p class="temp-main">
            <span th:text="${forecast.currentTemp}">0</span>°C
        </p>

        <p><span class="label">Stare:</span> <span th:text="${forecast.weatherState}">Sunny</span></p>

        <hr>

        <p><span class="label">Min/Max:</span>
            <span th:text="${forecast.minTemp}">0</span>°C /
            <span th:text="${forecast.maxTemp}">0</span>°C
        </p>

        <p><span class="label">Umiditate:</span> <span th:text="|${forecast.humidity}%|">0%</span></p>

        <p><span class="label">Vânt:</span>
            <span th:text="${forecast.windSpeed}">0</span> km/h
            (<span th:text="${forecast.windDirection}">N</span>)
        </p>
    </div>

    <!-- The image is placed right after the weather-card div -->
    <img th:src="@{/ad.jpg}" alt="Advertisement" class="ad-image">

</div>

</body>
</html>
