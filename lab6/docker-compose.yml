version: '3.8'

services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  # Cache
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  # Book Microservice (Kotlin + Postgres)
  book-service:
    build: ./BookMicroService
    container_name: book_service
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=bookdb
      - DB_USER=user
      - DB_PASSWORD=password
      - SERVER_PORT=8081

  # Caching Microservice (Kotlin + Redis)
  cache-service:
    build: ./CachingMicroService
    container_name: cache_service
    ports:
      - "8082:8082"
    depends_on:
      - redis
    environment:
      - SERVER_PORT=8082
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

  # Web Service (Python)
  web-service:
    build: ./WebService
    container_name: web_service
    ports:
      - "5000:5000"
    depends_on:
      - book-service
      - cache-service
    environment:
      - BOOK_SERVICE_URL=http://book-service:8081
      - CACHE_SERVICE_URL=http://cache-service:8082
