<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Home</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
        .menu-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .btn {
            padding: 20px 40px; font-size: 18px; cursor: pointer;
            border: none; border-radius: 8px; color: white; transition: 0.3s;
            text-decoration: none; display: inline-block;
        }
        .btn-view { background-color: #007bff; }
        .btn-add { background-color: #28a745; }
        .btn:hover { opacity: 0.8; }
        .logout { margin-top: 50px; display: block; color: red; }
    </style>
</head>
<body>
    <h1>Bun venit la Expense Tracker!</h1>
    <p>Ce dorești să faci astăzi?</p>

    <div class="menu-container">
        <a href="/expenses" class="btn btn-view">Vezi Cheltuieli</a>
        <a href="/add-expense" class="btn btn-add">Adaugă Nouă Cheltuială</a>
    </div>

    <a href="/logout" class="logout">Deconectare</a>
</body>
</html>
